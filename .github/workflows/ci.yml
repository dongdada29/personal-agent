name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - '22.18.0'
          - '24.x'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      # Test repositories pass their own Git identity with `git -c`; global and
      # system config are ignored on purpose, so the runner needs no git user.
      - name: Test
        env:
          PERSONAL_AGENT_SSE_REAL_SOCKETS: "1"
          GIT_CONFIG_GLOBAL: ${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}
          GIT_CONFIG_SYSTEM: ${{ runner.os == 'Windows' && 'NUL' || '/dev/null' }}
          GIT_CONFIG_NOSYSTEM: "1"
        run: npm test -- --maxWorkers=1 --minWorkers=1

      - name: Build
        run: npm run build

      # doctor only checks local prerequisites; engine authentication is reported as not_checked.
      - name: Doctor
        run: npm run doctor

      - name: Smoke
        run: npm run smoke

      - name: Demo self-check
        run: npm run demo -- --check

      - name: Share check
        run: npm run share:check

  desktop:
    name: desktop ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    env:
      # 产物不签名；禁止 electron-builder 在 CI 里寻找本机证书。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # npm ci --ignore-scripts 不会下载 Electron 二进制；打包与冒烟需要它。
      - name: Download Electron binary
        run: node node_modules/electron/install.js

      - name: Build web and desktop bundles
        run: npm run build

      - name: Bundle the desktop server
        run: node apps/desktop/scripts/build.mjs --skip-web

      - name: Smoke the bundled server
        run: node apps/desktop/scripts/smoke-bundle.mjs

      - name: Package
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --${{ matrix.target }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 14
